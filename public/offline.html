<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1f3a">
  <title>CareMesh — Offline</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box;background:#f4f7fb;font-family:Inter,system-ui,sans-serif;color:#12243a}
    .card{width:min(480px,100%);background:#fff;border:1px solid #dfe7f0;border-radius:24px;padding:28px;box-shadow:0 24px 70px rgba(16,40,68,.12);text-align:center}
    .mark{width:56px;height:56px;margin:0 auto 18px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(135deg,#315ed9,#10a8ac);color:#fff;font-weight:900}
    h1{margin:0 0 8px;font-size:24px}.muted{color:#6e7d8f;line-height:1.65;font-size:14px}
  </style>
</head>
<body><div class="card"><div class="mark">CM</div><h1>You’re offline</h1><p class="muted">CareMesh needs an active connection to load protected healthcare records. Reconnect and try again.</p></div></body>
</html>
